<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Game</title>

<style>

body{
margin:0;
background:black;
color:white;
font-family:monospace;
overflow:hidden;
}

#screen{
width:100vw;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

.menu{
font-size:28px;
margin:5px;
}

.selected{
color:yellow;
}

#dialogBox{
position:absolute;
bottom:30px;
left:50%;
transform:translateX(-50%);
width:80%;
height:120px;
border:3px solid white;
padding:15px;
font-size:22px;
display:none;
}

#next{
position:absolute;
right:15px;
bottom:10px;
font-size:20px;
}

input{
font-size:20px;
background:black;
color:white;
border:1px solid white;
margin-top:10px;
}

</style>
</head>

<body>

<div id="screen"></div>

<div id="dialogBox">
<div id="text"></div>
<div id="next">▼</div>
</div>

<script>

let state="title"
let menuIndex=0
let playerName=""

const menu=["ニューゲーム","コンテニュー"]

const screen=document.getElementById("screen")
const dialogBox=document.getElementById("dialogBox")
const text=document.getElementById("text")

let story=[]
let storyIndex=0


function drawTitle(){

screen.innerHTML=""

 const title=document.createElement("div")
title.className="title"
title.textContent="脱出ゲーム"
screen.appendChild(title)
 
menu.forEach((m,i)=>{

const div=document.createElement("div")
div.className="menu"

if(i===menuIndex){
div.classList.add("selected")
div.textContent="▶ "+m
}else{
div.textContent=m
}

screen.appendChild(div)

})

}


function nameInput(){

screen.innerHTML=""

const t=document.createElement("div")
t.textContent="名前を入力してください"
t.style.fontSize="24px"

const input.addEventListener("keydown",(e)=>{

if(e.key==="Enter"){

playerName = input.value

if(playerName === "シューティング"){
startShootingGame()
}else{
startStory()
}

}

})

screen.appendChild(t)
screen.appendChild(input)

input.focus()

}


function startStory(){

state="story"

screen.innerHTML=""

story=[
"...",
"町外れにある館",
"そこには化け物が出るという噂があった…",
]

storyIndex=0

dialogBox.style.display="block"

showText()

}


function showText(){

text.textContent=story[storyIndex]

}


document.addEventListener("keydown",(e)=>{

if(state==="title"){

if(e.key==="ArrowUp"){
menuIndex--
if(menuIndex<0) menuIndex=menu.length-1
drawTitle()
}

if(e.key==="ArrowDown"){
menuIndex++
if(menuIndex>=menu.length) menuIndex=0
drawTitle()
}

if(e.key==="Enter"){

if(menuIndex===0){
state="name"
nameInput()
}

if(menuIndex===1){
alert("セーブデータがありません")
}

}

}

else if(state==="story"){

if(e.key==="Enter"){

storyIndex++

if(storyIndex<story.length){
showText()
}else{
text.textContent="現在,開発中!"
}

}

}

})


function startShootingGame(){

state = "shooting"

screen.innerHTML = "<canvas id='game' width='600' height='400'></canvas>"

const canvas = document.getElementById("game")
const ctx = canvas.getContext("2d")

let playerX = 280
let bullets = []
let enemies = []

document.addEventListener("keydown",(e)=>{

if(e.key==="ArrowLeft"){
playerX -= 20
}

if(e.key==="ArrowRight"){
playerX += 20
}

if(e.key===" "){
bullets.push({x:playerX+10,y:350})
}

})

function spawnEnemy(){

enemies.push({
x:Math.random()*560,
y:0
})

}

setInterval(spawnEnemy,1000)

function update(){

ctx.fillStyle="black"
ctx.fillRect(0,0,600,400)



ctx.fillStyle="white"
ctx.fillRect(playerX,360,20,20)



bullets.forEach(b=>{
b.y -= 5
ctx.fillRect(b.x,b.y,5,10)
})



ctx.fillStyle="red"

enemies.forEach(e=>{
e.y += 2
ctx.fillRect(e.x,e.y,20,20)
})

requestAnimationFrame(update)

}

update()

}


drawTitle()

</script>

</body>
</html>
